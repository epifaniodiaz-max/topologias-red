<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topologías de Red Físicas</title>
<meta name="description" content="Topologías de red físicas: bus, estrella, anillo, malla y árbol. Simulador de fallas, laboratorio y quiz. Physical network topologies, bilingual.">
<meta property="og:type" content="website">
<meta property="og:title" content="Topologías de Red Físicas · Physical Network Topologies">
<meta property="og:description" content="Bus, estrella, anillo, malla y árbol con simulador de fallas, laboratorio de costos y confiabilidad, historia y quiz. Bilingüe ES/EN.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#070B1A">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect width=%2728%27 height=%2728%27 rx=%276%27 fill=%27%23070B1A%27/%3E%3Cpath d=%27M6 8 L22 6 L14 22 Z%27 fill=%27none%27 stroke=%27%235EE0FF%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27/%3E%3Ccircle cx=%276%27 cy=%278%27 r=%273%27 fill=%27%235EE0FF%27/%3E%3Ccircle cx=%2722%27 cy=%276%27 r=%273%27 fill=%27%23B38BFF%27/%3E%3Ccircle cx=%2714%27 cy=%2722%27 r=%273%27 fill=%27%232EE6A6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: glass top bar, a saturated gradient hero with a live network canvas, four chapter panels that each own one cable color (bus amber, star emerald, ring blue, mesh magenta), and the failure simulator as a neon control room. One committed dark world, no light variant. */
:root{
  --font-display:"Poppins","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#070B1A; --bg-2:#0B1230; --surface:#0F1836; --surface-2:#16224A; --surface-3:#1E2D61;
  --fg:#F1F4FF; --muted:#A9B5DA; --line:#27376B; --line-strong:#5E73BA;
  --accent:#5EE0FF; --accent-2:#B38BFF; --on-accent:#04202B;
  --bus:#FFB347; --bus2:#FF6B4A; --star:#2EE6A6; --star2:#18B6F0;
  --ring:#5B93FF; --ring2:#9B6BFF; --mesh:#E26BFF; --mesh2:#FF5C9A;
  --good:#2EE6A6; --warn:#FFC857; --bad:#FF6B6B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{margin:0;color:var(--fg);font:400 17px/1.62 var(--font-body);
  background:
    radial-gradient(1100px 700px at 100% 0%,rgba(155,107,255,.20),transparent 60%),
    radial-gradient(900px 700px at 0% 38%,rgba(24,182,240,.12),transparent 60%),
    radial-gradient(900px 700px at 100% 78%,rgba(226,107,255,.12),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(2.5rem,6vw,4.7rem);font-weight:700}
h2{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:700}
h3{font-size:1.18rem;font-weight:600}
p{margin:0 0 1em;max-width:66ch}
.label{font:500 .76rem/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.11em;color:var(--accent)}
.t-bus{--c:var(--bus);--c2:var(--bus2)} .t-star{--c:var(--star);--c2:var(--star2)}
.t-ring{--c:var(--ring);--c2:var(--ring2)} .t-mesh{--c:var(--mesh);--c2:var(--mesh2)}
.gtext{background:linear-gradient(95deg,var(--c),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:20px;padding:12px 18px;margin-top:14px;border-radius:16px;
  background:rgba(10,16,42,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(150,170,255,.20)}
.brand{display:flex;align-items:center;gap:10px;font:600 1.02rem var(--font-display);color:var(--fg);text-decoration:none;white-space:nowrap}
.bar nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
.bar nav a{padding:7px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-size:.92rem;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.bar nav a:hover{color:#fff;background:rgba(150,170,255,.14)}
.tools{display:flex;gap:8px}
.tbtn{font:600 .84rem var(--font-mono);padding:8px 13px;border-radius:9px;border:1px solid rgba(150,170,255,.30);background:rgba(255,255,255,.05);color:var(--fg);cursor:pointer;transition:border-color .15s,background .15s}
.tbtn:hover{border-color:var(--accent);background:rgba(94,224,255,.10)}
@media(max-width:820px){.bar nav{display:none}.bar{justify-content:space-between}}
@media(max-width:620px){.bar{gap:8px;padding:9px 10px}.brand span{display:none}.tools{gap:6px}.tbtn{padding:7px 9px;font-size:.76rem}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:12px;border:1px solid rgba(160,180,255,.30);background:rgba(255,255,255,.06);color:var(--fg);font:600 .95rem var(--font-body);text-decoration:none;cursor:pointer;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);background:rgba(94,224,255,.12)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:0 10px 30px -10px rgba(94,224,255,.7)}
.btn.primary:hover{box-shadow:0 14px 36px -8px rgba(179,139,255,.85)}
.btn.small{padding:9px 14px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* hero */
.hero{position:relative;margin-top:22px;border-radius:30px;overflow:hidden;border:1px solid rgba(140,160,255,.28);
  background:
    radial-gradient(900px 520px at 90% -10%,rgba(155,107,255,.70),transparent 60%),
    radial-gradient(760px 520px at -4% 110%,rgba(24,182,240,.50),transparent 62%),
    radial-gradient(520px 320px at 62% 105%,rgba(226,107,255,.34),transparent 70%),
    linear-gradient(135deg,#0A1238,#111C52 55%,#1B1257);
  box-shadow:0 50px 100px -50px rgba(91,147,255,.65)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,11,26,.80) 0%,rgba(7,11,26,.46) 46%,transparent 82%);pointer-events:none}
.hero-in{position:relative;z-index:1;padding:clamp(36px,6.5vw,84px) clamp(22px,5vw,64px);display:grid;gap:24px;max-width:780px}
.hero h1{background:linear-gradient(100deg,#fff 0%,#C9D8FF 42%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:1.22rem;color:#C5D0F0;max-width:52ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 17px;border-radius:999px;color:#fff;text-decoration:none;font:600 .9rem var(--font-body);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 32%,transparent),color-mix(in srgb,var(--c2) 20%,transparent));
  border:1px solid color-mix(in srgb,var(--c) 60%,transparent);transition:transform .15s,box-shadow .15s}
.chip i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 0 10px var(--c)}
.chip:hover{transform:translateY(-2px);box-shadow:0 10px 26px -10px var(--c)}
@media(max-width:700px){.hero::after{background:rgba(7,11,26,.62)}}

section{padding-block:clamp(36px,5.5vw,68px)}
.sec-head{display:grid;gap:12px;margin-bottom:30px}
.sec-head p{color:var(--muted)}

/* fundamentals */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.tbl-scroll{overflow-x:auto;border:1px solid rgba(150,170,255,.22);border-radius:18px;background:rgba(15,24,54,.72)}
table{border-collapse:collapse;width:100%}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid rgba(150,170,255,.14);font-size:.95rem;vertical-align:top}
th{font:500 .74rem var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);background:rgba(94,224,255,.07)}
tr:last-child td{border-bottom:0}
.crit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:36px}
.ccard{padding:20px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--surface)),var(--surface) 72%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ccard h3{margin-bottom:6px;color:var(--c)}
.ccard p{color:var(--muted);font-size:.94rem;margin:0}
@media(max-width:860px){.crit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:480px){.crit{grid-template-columns:minmax(0,1fr)}}

/* chapters */
#topologias{padding-top:20px}
.chapter{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,4vw,56px);align-items:start;padding:clamp(24px,4vw,52px);margin-block:30px;border-radius:30px;
  background:
    radial-gradient(900px 420px at 8% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 62%),
    radial-gradient(700px 400px at 100% 100%,color-mix(in srgb,var(--c2) 18%,transparent),transparent 62%),
    linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid color-mix(in srgb,var(--c) 42%,transparent);
  box-shadow:0 40px 90px -50px color-mix(in srgb,var(--c) 70%,transparent)}
.chapter.rev .ch-vis{order:2}
.ch-vis{position:sticky;top:96px}
@media(max-width:860px){.chapter{grid-template-columns:minmax(0,1fr)}.chapter.rev .ch-vis{order:0}.ch-vis{position:static}}
.card{background:rgba(15,24,54,.78);border:1px solid rgba(150,170,255,.22);border-radius:20px}
.diagram{padding:10px;border-radius:22px;
  background:
    radial-gradient(circle at 1px 1px,rgba(150,170,255,.20) 1px,transparent 1.3px) 0 0/22px 22px,
    radial-gradient(420px 280px at 50% 42%,color-mix(in srgb,var(--c) 24%,transparent),transparent 72%),
    var(--surface);
  border:1px solid color-mix(in srgb,var(--c) 50%,transparent);
  box-shadow:0 30px 70px -34px color-mix(in srgb,var(--c) 85%,transparent)}
.diagram svg,.simsvg{display:block;width:100%;height:auto}
.sheet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;margin:14px 10px 8px;font-size:.9rem}
.sheet dt{font:500 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--c);padding-top:3px}
.sheet dd{margin:0;color:#DCE3FA}
.ch-kicker{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch-kicker i{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 0 14px var(--c)}
.ch-kicker .label{color:var(--c)}
.ch-txt h2{background:linear-gradient(95deg,#fff 10%,var(--c) 70%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ch-tag{font:500 1.3rem/1.25 var(--font-display);color:var(--c);margin:12px 0 18px}
.pc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin:22px 0}
@media(max-width:560px){.pc{grid-template-columns:minmax(0,1fr)}}
.pc>div{padding:16px 18px;border-radius:16px;background:rgba(7,11,26,.42);border:1px solid rgba(150,170,255,.14)}
.pc h4,.uses h4{margin:0 0 10px;font:500 .76rem var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
ul.pm,ul.us{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ul.pm li,ul.us li{position:relative;padding-left:22px;font-size:.96rem;line-height:1.45}
ul.pm.pro li::before{content:"+";position:absolute;left:0;top:0;font:700 1rem var(--font-mono);color:var(--good)}
ul.pm.con li::before{content:"\2212";position:absolute;left:0;top:0;font:700 1rem var(--font-mono);color:var(--bad)}
ul.us li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 0 8px var(--c)}
.uses{margin-bottom:22px}
.ch-txt .btn{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent)}
.ch-txt .btn:hover{background:color-mix(in srgb,var(--c) 30%,transparent);border-color:var(--c)}

/* svg shared */
.lk{stroke:var(--line-strong);stroke-width:2.5;fill:none;stroke-linecap:round}
.lk.bb{stroke-width:6;stroke:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.nd{fill:var(--surface-2);stroke:var(--c);stroke-width:3;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 80%,transparent))}
.hubr{fill:var(--c);filter:drop-shadow(0 0 10px var(--c))}
.nt{font:600 12px var(--font-mono);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ht{font:700 11px var(--font-mono);fill:#06101F;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tapd{fill:var(--c)}
.trm{fill:#fff}
.trt{font:500 10px var(--font-mono);fill:var(--muted);text-anchor:middle}
.pk{fill:#fff;filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 2px var(--c))}

/* simulator */
#simulador{border-radius:30px;padding:clamp(24px,4vw,52px);margin-block:30px;
  background:
    radial-gradient(800px 420px at 100% 0%,rgba(226,107,255,.26),transparent 60%),
    radial-gradient(700px 420px at 0% 100%,rgba(46,230,166,.18),transparent 60%),
    linear-gradient(135deg,#0D1640,#150F3C);
  border:1px solid rgba(160,180,255,.28);box-shadow:0 50px 100px -50px rgba(155,107,255,.6)}
.sim{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px;align-items:start}
@media(max-width:900px){.sim{grid-template-columns:minmax(0,1fr)}}
.sim-card{padding:12px;background:
  radial-gradient(circle at 1px 1px,rgba(150,170,255,.18) 1px,transparent 1.3px) 0 0/24px 24px,
  radial-gradient(520px 340px at 50% 45%,color-mix(in srgb,var(--c) 20%,transparent),transparent 72%),var(--surface);
  border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.ctl{padding:20px;display:grid;gap:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 .9rem var(--font-body);padding:9px 15px;border-radius:10px;border:1px solid rgba(160,180,255,.25);background:rgba(255,255,255,.05);color:var(--fg);cursor:pointer;transition:background .15s}
.seg button:hover{background:rgba(255,255,255,.12)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--c),var(--c2));border-color:transparent;color:#06101F}
.seg.modes button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#06101F}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{padding:11px 13px;border-radius:12px;background:rgba(7,11,26,.5);border:1px solid rgba(150,170,255,.14)}
.metric b{display:block;font:700 1.65rem/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--c)}
.metric span{font-size:.8rem;color:var(--muted)}
.state{display:flex;align-items:center;gap:10px;font-weight:600;padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--good) 18%,var(--surface-2));border:1px solid color-mix(in srgb,var(--good) 50%,transparent)}
.state i{width:11px;height:11px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);flex:none}
.state[data-s="degraded"]{background:color-mix(in srgb,var(--warn) 18%,var(--surface-2));border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.state[data-s="degraded"] i{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.state[data-s="down"]{background:color-mix(in srgb,var(--bad) 20%,var(--surface-2));border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.state[data-s="down"] i{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.rule{font-size:.92rem;color:var(--muted);margin:0}
.log{min-height:3.4em;font:400 .84rem/1.45 var(--font-mono);background:rgba(7,11,26,.6);color:#CFE9FF;padding:11px 13px;border-radius:12px;margin:0;border:1px solid rgba(150,170,255,.14)}
.hintline{font-size:.9rem;color:var(--muted);margin:12px 6px 4px}
.slk{stroke:var(--line-strong);stroke-width:3;fill:none;stroke-linecap:round}
.slk.bb{stroke-width:7}
.slk.dual{stroke-width:9}
.slk.inner{stroke:var(--surface);stroke-width:3}
.slk.on{stroke:var(--c);filter:drop-shadow(0 0 5px var(--c))}
.slk.bad{stroke:var(--bad);stroke-dasharray:3 7}
.hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke;cursor:pointer}
.sx{stroke:var(--bad);stroke-width:3.5;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--bad))}
.snd{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:3;cursor:pointer}
.snd.up{stroke:var(--c);filter:drop-shadow(0 0 9px var(--c))}
.snd.iso{stroke:var(--warn);stroke-dasharray:4 4}
.snd.bad{stroke:var(--bad);fill:#2A1530}
.shub{fill:var(--line-strong);cursor:pointer}
.shub.up{fill:var(--c);filter:drop-shadow(0 0 12px var(--c))}
.shub.bad{fill:var(--bad)}
g[data-node]:focus-visible .snd,g[data-node]:focus-visible .shub{stroke:var(--accent);stroke-width:4}
g[data-node]{outline:none}
.spkt{fill:#fff;stroke:var(--c);stroke-width:2;filter:drop-shadow(0 0 10px #fff)}

/* comparison */
#comparativa{border-radius:30px;padding:clamp(24px,4vw,52px);margin-block:30px;
  background:radial-gradient(800px 400px at 0% 0%,rgba(24,182,240,.18),transparent 62%),radial-gradient(700px 400px at 100% 100%,rgba(226,107,255,.16),transparent 62%),linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid rgba(160,180,255,.24)}
.cmp{min-width:860px}
.cmp th.tc{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c2) 12%,transparent))}
.cmp td.v{white-space:nowrap}
.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;background:rgba(150,170,255,.20);margin-right:4px}
.dots i.on{background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 0 9px var(--c)}
.note{font-size:.88rem;color:var(--muted);margin:12px 4px 0}

/* calculator */
.calc{padding:24px;margin-top:28px;display:grid;gap:18px}
.calc input[type=range]{width:100%;accent-color:var(--accent)}
.calc-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.calc-head b{font:700 2.2rem var(--font-display);font-variant-numeric:tabular-nums;background:linear-gradient(95deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.crow{display:grid;gap:7px;padding-top:14px;border-top:1px solid rgba(150,170,255,.16)}
.crow h3{font-size:1rem;color:var(--c)}
.bl{display:grid;grid-template-columns:150px minmax(0,1fr) 130px;gap:12px;align-items:center;font-size:.88rem;color:var(--muted)}
.bl span:last-child{font:500 .85rem var(--font-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.bar-t{height:11px;border-radius:7px;background:rgba(150,170,255,.14);overflow:hidden}
.bar-t span{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2));border-radius:7px;box-shadow:0 0 12px var(--c);transition:width .3s}
@media(max-width:560px){.bl{grid-template-columns:minmax(0,1fr) 100px}.bl .bn{grid-column:1/-1}}

/* hybrids, conclusions, sources */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:28px}
.cards .card{padding:22px}
.cards .hc{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--surface)),var(--surface) 70%);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.cards h3{margin-bottom:8px;color:var(--c)}

footer{margin-top:30px;border-top:1px solid rgba(150,170,255,.22);padding-block:32px 52px;color:var(--muted);font-size:.9rem;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

/* ===== v3 additions ===== */
.t-tree{--c:#FFD84D;--c2:#FF9F43}
#prog{position:fixed;left:0;top:0;height:4px;width:0;z-index:60;background:linear-gradient(90deg,var(--bus),var(--star),var(--ring),var(--mesh));box-shadow:0 0 12px rgba(94,224,255,.8);pointer-events:none}
.dots-nav{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:11px;padding:12px 8px;border-radius:999px;background:rgba(10,16,42,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(150,170,255,.18)}
.dots-nav a{position:relative;width:11px;height:11px;border-radius:50%;background:rgba(150,170,255,.35);transition:transform .2s,background .2s,box-shadow .2s;display:block}

.dots-nav a.on{background:var(--accent);box-shadow:0 0 10px var(--accent);transform:scale(1.35)}
.dots-nav a::after{content:attr(data-t);position:absolute;right:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font:500 .76rem var(--font-body);padding:4px 10px;border-radius:8px;background:rgba(10,16,42,.95);border:1px solid rgba(150,170,255,.3);color:#fff;opacity:0;pointer-events:none;transition:opacity .15s}

.bar nav a{padding:7px 10px;font-size:.88rem}
.tbtn.on{background:rgba(94,224,255,.18);border-color:var(--accent)}
.hero .chips .chip{flex:none}

/* presentation HUD */
#hud{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:999px;background:rgba(10,16,42,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(94,224,255,.5);box-shadow:0 20px 50px -20px rgba(94,224,255,.7);font:500 .88rem var(--font-body);color:#fff;max-width:calc(100vw - 32px)}

#hud b{font:600 .85rem var(--font-mono);color:var(--accent)}
#hud .ht2{max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(160,180,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:1.05rem;cursor:pointer}

/* intro */
.objs{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.objs li{padding:14px 18px;border-radius:14px;background:rgba(15,24,54,.74);border:1px solid rgba(150,170,255,.2);border-left:4px solid var(--accent)}
.objs li:nth-child(2){border-left-color:var(--bus)}.objs li:nth-child(3){border-left-color:var(--star)}.objs li:nth-child(4){border-left-color:var(--ring)}.objs li:nth-child(5){border-left-color:var(--mesh)}
.objs b{display:block;font:500 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:3px}
.objs span{font-size:.95rem;color:#D4DDF5}

/* gear */
.gear{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:960px){.gear{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:560px){.gear{grid-template-columns:minmax(0,1fr)}}
.gcard{padding:18px;border-radius:20px;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 26%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);transition:box-shadow .25s,border-color .25s}
.gcard:hover{box-shadow:0 24px 50px -24px var(--c);border-color:var(--c)}
.gcard svg{width:100%;height:auto;display:block;border-radius:14px;background:radial-gradient(circle at 1px 1px,rgba(150,170,255,.18) 1px,transparent 1.3px) 0 0/16px 16px,rgba(7,11,26,.5);margin-bottom:14px}
.gcard h3{color:var(--c);margin-bottom:6px;font-size:1.05rem}
.gcard p{margin:0;font-size:.93rem;color:#C5D0EE}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .25s,border-color .25s;will-change:transform}

/* glossary tooltips */
abbr.gl{text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:help;position:relative;color:inherit}
abbr.gl::after{content:attr(data-d);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);width:max-content;max-width:min(300px,70vw);padding:10px 13px;border-radius:12px;background:#0B1230;border:1px solid var(--accent);color:#fff;font:400 .85rem/1.4 var(--font-body);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:40;box-shadow:0 14px 34px -12px rgba(94,224,255,.6)}
abbr.gl:hover::after,abbr.gl:focus::after{opacity:1;transform:translateX(-50%)}

/* demo (paso a paso) */
.demo{display:grid;gap:8px;padding:10px 12px 4px}
.demo-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo .dstep{font:500 .76rem var(--font-mono);color:var(--c);letter-spacing:.06em}
.dtext{margin:0;min-height:3.1em;font-size:.93rem;line-height:1.45;color:#DCE5FF}
.dprog{display:flex;gap:5px}.dprog i{flex:1;height:4px;border-radius:3px;background:rgba(150,170,255,.2);transition:background .3s}.dprog i.on{background:linear-gradient(90deg,var(--c),var(--c2))}
.mac{font:500 .78rem var(--font-mono);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:10px;padding:8px 10px;background:rgba(7,11,26,.6);color:#CFE9FF}
.mac b{color:var(--c)}
.mac div{display:flex;justify-content:space-between;gap:12px}
.dg .nd.hl,.dg .nd.rx{stroke:#fff;fill:color-mix(in srgb,var(--c) 40%,var(--surface-2))}
.dg .dim{opacity:.28}
.dg .nd.bad,.dg .hubr.bad{stroke:var(--bad);fill:#3A1530}
.dg .hubr.bad{fill:var(--bad)}
.dg .lk.bad{stroke:var(--bad);stroke-dasharray:3 7}
.dg .lk.hot{stroke:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.dg .flash{animation:flash .5s ease 3}
@keyframes flash{50%{filter:drop-shadow(0 0 16px #fff)}}
.dg .dpk{fill:#fff;stroke:var(--c);stroke-width:2;filter:drop-shadow(0 0 8px #fff)}
.dg .dpk.tok{fill:#FFD84D;stroke:#fff}
.dg .dpk.red{fill:var(--bad);stroke:#fff}
.dg .boom{font:700 22px var(--font-display);fill:var(--bad);text-anchor:middle;filter:drop-shadow(0 0 8px var(--bad))}

/* lab */
#laboratorio{border-radius:30px;padding:clamp(24px,4vw,52px);margin-block:30px;
  background:radial-gradient(800px 420px at 0% 0%,rgba(255,216,77,.16),transparent 60%),radial-gradient(700px 420px at 100% 100%,rgba(91,147,255,.22),transparent 60%),linear-gradient(135deg,#0D1640,#12113A);
  border:1px solid rgba(160,180,255,.26)}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.lab-grid .wide{grid-column:1/-1}
@media(max-width:900px){.lab-grid{grid-template-columns:minmax(0,1fr)}}
.lab{padding:22px;display:grid;gap:14px;align-content:start}
.lab h3{font-size:1.2rem}.lab .sub{color:var(--muted);font-size:.9rem;margin:-6px 0 0}
.lab .seg button{padding:7px 12px;font-size:.84rem}
.ab-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid rgba(150,170,255,.14);font-size:.88rem}
.ab-row .l{text-align:center;color:var(--muted)}

.ab-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.86rem}

.field{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
.field input[type=number]{width:100%;padding:8px 10px;border-radius:9px;border:1px solid rgba(160,180,255,.3);background:rgba(7,11,26,.6);color:#fff;font:500 .9rem var(--font-mono)}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.cost-row{display:grid;grid-template-columns:90px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:.86rem}
.cost-row .nm{color:var(--c);font-weight:600}
.cost-row .v{font:500 .82rem var(--font-mono);text-align:right}

.rel-row{display:grid;grid-template-columns:130px minmax(0,1fr) 84px;gap:12px;align-items:center;font-size:.88rem}

.rel-row small{display:block;color:var(--muted);font-size:.74rem}
.rel-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline}
.rel-head b{font:700 1.6rem var(--font-display);color:var(--accent)}

/* timeline */
.tl{position:relative;display:grid;gap:22px;padding-left:34px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--bus),var(--star),var(--ring),var(--mesh))}
.tl-item{position:relative;padding:18px 22px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);max-width:760px;transition:box-shadow .25s}
.tl-item:hover{box-shadow:0 18px 44px -22px var(--c)}
.tl-item::before{content:"";position:absolute;left:-30px;top:24px;width:15px;height:15px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);border:3px solid var(--bg)}
.tl-item .yr{font:700 1.5rem var(--font-display);background:linear-gradient(95deg,var(--c),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tl-item h3{margin:2px 0 6px;font-size:1.08rem}.tl-item p{margin:0;font-size:.94rem;color:#C9D4F0}

/* learn */
.learn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media(max-width:900px){.learn{grid-template-columns:minmax(0,1fr)}}
.qcard{padding:24px;display:grid;gap:14px;align-content:start}
.qcard h3{font-size:1.2rem}
.qn{font:500 .76rem var(--font-mono);color:var(--accent);letter-spacing:.08em}
.opts{display:grid;gap:9px}
.opts button{text-align:left;padding:12px 15px;border-radius:12px;border:1px solid rgba(160,180,255,.28);background:rgba(255,255,255,.05);color:var(--fg);font:500 .95rem var(--font-body);cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.opts button:hover:not([disabled]){background:rgba(94,224,255,.14);border-color:var(--accent);transform:translateX(3px)}
.opts button.ok{background:color-mix(in srgb,var(--good) 24%,var(--surface-2));border-color:var(--good)}
.opts button.no{background:color-mix(in srgb,var(--bad) 24%,var(--surface-2));border-color:var(--bad)}
.expl{margin:0;font-size:.92rem;padding:11px 14px;border-radius:12px;background:rgba(7,11,26,.5);border:1px solid rgba(150,170,255,.16)}
.big{font:700 2.6rem/1 var(--font-display);background:linear-gradient(95deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rec-res{display:grid;gap:12px}
.rec-res .win{padding:16px;border-radius:16px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 34%,var(--surface)),var(--surface));border:1px solid var(--c)}

.rec-res .win strong{font:700 1.7rem var(--font-display);display:block;color:#fff}
.rec-res .win p{margin:8px 0 0;font-size:.93rem}
.sc-row{display:grid;grid-template-columns:80px minmax(0,1fr) 38px;gap:10px;align-items:center;font-size:.84rem;color:var(--muted)}

/* glossary page */
#glosario input[type=search]{width:100%;max-width:440px;padding:12px 16px;border-radius:12px;border:1px solid rgba(160,180,255,.32);background:rgba(7,11,26,.6);color:#fff;font:500 1rem var(--font-body);margin-bottom:20px}

/* hover polish + scroll reveal */
.chapter .card.diagram:hover{box-shadow:0 36px 80px -30px var(--c)}

  @keyframes rise{from{opacity:0;transform:translateY(34px) scale(.98)}to{opacity:1;transform:none}}

/* glossary */
.gl-tools{display:grid;gap:12px;margin:14px 0 6px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.fchip{padding:7px 13px;border-radius:999px;border:1px solid rgba(150,170,255,.3);background:rgba(255,255,255,.04);color:var(--fg);font:500 .84rem var(--font-body);cursor:pointer;transition:background .2s,border-color .2s}
.fchip:hover{border-color:var(--accent)}
.fchip[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;font-weight:700}
.azrow .fchip{padding:5px 0;width:32px;text-align:center;font-family:var(--font-mono)}
.fchip:disabled{opacity:.3;cursor:default}
.gl-list{align-items:start}
.gl-list .gl-it{padding:0;border-radius:14px;background:rgba(15,24,54,.74);border:1px solid rgba(150,170,255,.2);overflow:hidden}
.gl-list .gl-it[open]{border-color:rgba(94,224,255,.45)}
.gl-it>summary{padding:12px 14px;align-items:flex-start}
.gl-it .gt{flex:1;display:grid;gap:3px;min-width:0}
.gl-it .gt b{font:600 1rem var(--font-display);color:var(--accent)}
.gl-it .gt span{font-size:.88rem;color:#CBD6F2;font-weight:400;font-family:var(--font-body)}
.gl-it .gl-long{margin:0;padding:0 16px 14px;font-size:.92rem;color:#E0E7FA;animation:accIn .3s ease both}
.gl-it .gl-cat{display:inline-block;margin:0 16px 14px;font:500 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent-2)}
.gl-count{font:500 .8rem var(--font-mono);color:var(--muted)}
/* hero stats */
.stats{display:flex;gap:clamp(16px,3vw,38px);flex-wrap:wrap;margin-top:30px}
.stat{display:grid;gap:2px}
.stat b{font:700 clamp(1.7rem,4vw,2.5rem) var(--font-display);background:linear-gradient(95deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* cableado */
.cab-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:start;margin-top:8px}
@media(max-width:900px){.cab-grid{grid-template-columns:minmax(0,1fr)}}
.svgbox{padding:14px;border-radius:20px;background:rgba(15,24,54,.78);border:1px solid rgba(150,170,255,.22)}
.svgbox svg{width:100%;height:auto;display:block;border-radius:12px;background:radial-gradient(circle at 1px 1px,rgba(150,170,255,.16) 1px,transparent 1.3px) 0 0/16px 16px,rgba(7,11,26,.5)}
.svgbox figcaption{margin-top:10px;font-size:.88rem;color:var(--muted);text-align:center}
figure.svgbox{margin:0}
.sv-box{fill:rgba(22,34,74,.95);stroke:#5E73BA;stroke-width:1.5}
.sv-fl{fill:rgba(255,255,255,.025);stroke:#27376B;stroke-width:1}
.sv-hz{stroke:#5EE0FF;stroke-width:1.8;fill:none}
.sv-bb{stroke:#FFD84D;stroke-width:4;fill:none;stroke-linecap:round}
.sv-isp{stroke:#B38BFF;stroke-width:3;fill:none}
.sv-tx{fill:#C9D4F0;font:12px Inter,system-ui,sans-serif}
.sv-tx.b{font-weight:600;fill:#F1F4FF}
.sv-pc{fill:#16224A;stroke:#5EE0FF;stroke-width:1.5}
.sv-ld{stroke:#7E90CC;stroke-width:1;fill:none}
.sv-port{fill:#5EE0FF}.sv-led{fill:#59F0A0}
.tblwrap{overflow-x:auto;border-radius:16px;border:1px solid rgba(150,170,255,.22);margin:12px 0}
table.cat{width:100%;border-collapse:collapse;min-width:520px;background:rgba(15,24,54,.7)}
table.cat th,table.cat td{padding:12px 16px;text-align:left;font-size:.92rem;border-bottom:1px solid rgba(150,170,255,.14)}
table.cat th{font:600 .78rem var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:rgba(94,224,255,.07)}
table.cat tr:last-child td{border-bottom:0}
.t568{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:14px 0}
@media(max-width:700px){.t568{grid-template-columns:minmax(0,1fr)}}
.t568 .end{padding:16px;border-radius:18px;background:rgba(15,24,54,.78);border:1px solid rgba(150,170,255,.22)}
.t568 h4{margin:0 0 10px}
.pins{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:12px}
.pin{display:grid;gap:5px;justify-items:center;font:500 .7rem var(--font-mono);color:var(--muted)}
.pin i{display:block;width:100%;max-width:34px;height:64px;border-radius:5px;border:1px solid rgba(255,255,255,.35);transition:background .3s}
.pin small{font-size:.62rem;text-align:center;line-height:1.15;color:#B9C6EA;min-height:2.4em}
@media(max-width:520px){.pin small{display:none}}
.t568res{padding:12px 16px;border-radius:12px;background:rgba(94,224,255,.09);border:1px solid rgba(94,224,255,.35);font-size:.94rem}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}
@media(max-width:900px){.gal{grid-template-columns:minmax(0,1fr)}}
/* design + game */
.dz{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vw,36px);align-items:start}
@media(max-width:860px){.dz{grid-template-columns:minmax(0,1fr)}}
.dz .card,.gm .card{padding:clamp(16px,2.5vw,26px)}
.dz .field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-bottom:16px}
.dz .field label{font-weight:600;font-size:.94rem}
.dz input[type=range]{width:100%;accent-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{padding:12px 14px;border-radius:14px;background:rgba(94,224,255,.07);border:1px solid rgba(94,224,255,.25)}
.tile b{display:block;font:700 1.15rem var(--font-display);color:var(--fg);overflow-wrap:anywhere}
.tile span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dz .why{padding:12px 16px;border-left:3px solid var(--accent);background:rgba(255,255,255,.04);border-radius:0 12px 12px 0;margin:10px 0}
.dz .note,.gm .note{font-size:.84rem;color:var(--muted)}
.gm{margin-top:36px}
.gm svg{width:100%;max-width:520px;height:auto;display:block;margin:12px auto;touch-action:none;border-radius:16px;background:radial-gradient(circle at 1px 1px,rgba(150,170,255,.16) 1px,transparent 1.3px) 0 0/16px 16px,rgba(7,11,26,.5);user-select:none}
.gm .gnode{cursor:pointer}
.gm .gnode circle{fill:#16224A;stroke:#5EE0FF;stroke-width:2.5;transition:fill .2s,stroke .2s}
.gm .gnode.sel circle{fill:#5EE0FF}
.gm .gnode text{fill:#F1F4FF;font:600 13px Inter,system-ui,sans-serif;pointer-events:none}
.gm .gnode.sel text{fill:#04202B}
.gm .glink{stroke:#B38BFF;stroke-width:3;stroke-linecap:round}
.gm .ghit{stroke:transparent;stroke-width:16;cursor:pointer}
.gm .gmsg{min-height:2.6em;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05);font-size:.94rem}
.gm .gmsg.ok{background:rgba(89,240,160,.12);border:1px solid rgba(89,240,160,.5)}
/* faq */
.faq-list .acc>summary{font-size:1rem}
.faq-list .acc-b p{margin:0;color:#D3DCF4}
/* refs groups */
#refWrap .acc>.acc-b{padding-top:10px}
#refWrap .refs{margin-top:0}
/* search overlay */
.kov{position:fixed;inset:0;z-index:200;background:rgba(4,8,22,.72);backdrop-filter:blur(6px);display:grid;place-items:start center;padding:12vh 16px 16px}
.kov[hidden]{display:none}
.kbox{width:min(640px,100%);border-radius:18px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 30px 80px -20px #000;overflow:hidden}
.kbox input{width:100%;padding:18px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:500 1.05rem var(--font-body);outline:none}
.kbox ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.kbox li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.kbox li[aria-selected="true"],.kbox li:hover{background:rgba(94,224,255,.14)}
.kbox li em{flex:none;font:500 .68rem var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent-2);min-width:74px;font-style:normal}
.kbox li b{font-weight:600;font-size:.95rem}
.kbox li small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.kbox .khint{margin:0;padding:10px 16px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line)}
#kBtn span{display:none}#kBtn{font-size:1.05rem;padding-inline:12px}.tbtn{white-space:nowrap}
#cableado h3,.gm h3{margin:0 0 10px}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
body.pres .kov{display:none}
</style>
</head>

/* ---------- layout (shared by diagrams and simulator) ---------- */
function layout(type,W,H,o){
  o=o||{};
  var cx=W/2,cy=H/2,R=Math.min(W,H)*0.36,n=6,nodes=[],links=[],i;
  function circ(k){var a=-Math.PI/2+k*2*Math.PI/n;return{x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}}
  if(type==="star"){
    nodes.push({id:"H",kind:"hub",label:"SW",x:cx,y:cy});
    for(i=0;i<n;i++){var p=circ(i);nodes.push({id:"N"+i,idx:i,kind:"pc",x:p.x,y:p.y});links.push({id:"L"+i,a:"H",b:"N"+i,kind:"lk"})}
  }else if(type==="tree"){
    var sxs=[W*0.27,W*0.73],dxx=W*0.13;
    nodes.push({id:"C",kind:"hub",label:"CORE",x:cx,y:H*0.14});
    for(i=0;i<2;i++){nodes.push({id:"S"+i,kind:"hub",label:"SW"+(i+1),x:sxs[i],y:H*0.46});links.push({id:"U"+i,a:"C",b:"S"+i,kind:"up"})}
    for(i=0;i<n;i++){var sI=Math.floor(i/3);nodes.push({id:"N"+i,idx:i,kind:"pc",x:sxs[sI]+(i%3-1)*dxx,y:H*0.84});links.push({id:"L"+i,a:"S"+sI,b:"N"+i,kind:"lk"})}
  }else if(type==="bus"){
    var x0=W*0.08,x1=W*0.92,off=R*0.62;
    nodes.push({id:"E0",kind:"term",x:x0,y:cy},{id:"E1",kind:"term",x:x1,y:cy});
    for(i=0;i<n;i++){
      var tx=x0+(x1-x0)*(i+0.5)/n;
      nodes.push({id:"T"+i,kind:"tap",x:tx,y:cy});
      nodes.push({id:"N"+i,idx:i,kind:"pc",x:tx,y:(i%2)?cy+off:cy-off});
      links.push({id:"D"+i,a:"T"+i,b:"N"+i,kind:"drop"});
    }
    links.push({id:"B-1",a:"E0",b:"T0",kind:"bb"});
    for(i=0;i<n-1;i++)links.push({id:"B"+i,a:"T"+i,b:"T"+(i+1),kind:"bb"});
    links.push({id:"B"+(n-1),a:"T"+(n-1),b:"E1",kind:"bb"});
  }else{
    for(i=0;i<n;i++){var q=circ(i);nodes.push({id:"N"+i,idx:i,kind:"pc",x:q.x,y:q.y})}
    if(type==="ring"){for(i=0;i<n;i++)links.push({id:"L"+i,a:"N"+i,b:"N"+((i+1)%n),kind:"lk"})}
    else if(o.mesh==="partial"){
      for(i=0;i<n;i++)links.push({id:"L"+i,a:"N"+i,b:"N"+((i+1)%n),kind:"lk"});
      for(i=0;i<3;i++)links.push({id:"X"+i,a:"N"+i,b:"N"+(i+3),kind:"lk"});
    }else{
      for(i=0;i<n;i++)for(var j=i+1;j<n;j++)links.push({id:"L"+i+"_"+j,a:"N"+i,b:"N"+j,kind:"lk"});
    }
  }
  var by={};nodes.forEach(function(nd){by[nd.id]=nd});
  return{nodes:nodes,links:links,by:by,W:W,H:H,cx:cx,cy:cy,R:R};
}
function nm(nd){if(nd.kind==="hub")return nd.id==="H"?L().sw:nd.id==="C"?"Core":L().sw+" "+(+nd.id.slice(1)+1);if(nd.kind==="pc")return L().pc+(nd.idx+1);return""}

/* ---------- static diagrams ---------- */
function pkt(path,dur,begin){return '<circle class="pk" r="4.5"><animateMotion dur="'+dur+'s" begin="'+begin+'s" repeatCount="indefinite" path="'+path+'"/></circle>'}
function drawStatic(svg,type){
  var W=400,H=300,G=layout(type,W,H,{mesh:"full"}),ls="",ns="",k="";
  G.links.forEach(function(l){var a=G.by[l.a],b=G.by[l.b];ls+='<line class="lk'+(l.kind==="bb"?" bb":"")+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"/>'});
  G.nodes.forEach(function(nd){
    var ns0=ns;
    if(nd.kind==="pc")ns+='<circle class="nd" cx="'+nd.x+'" cy="'+nd.y+'" r="15"/><text class="nt" x="'+nd.x+'" y="'+nd.y+'">'+(nd.idx+1)+'</text>';
    else if(nd.kind==="hub")ns+='<rect class="hubr" x="'+(nd.x-24)+'" y="'+(nd.y-16)+'" width="48" height="32" rx="8"/><text class="ht" x="'+nd.x+'" y="'+nd.y+'">'+(nd.label||"SW")+'</text>';
    else if(nd.kind==="tap")ns+='<circle class="tapd" cx="'+nd.x+'" cy="'+nd.y+'" r="4"/>';
    else if(nd.kind==="term")ns+='<rect class="trm" x="'+(nd.x-3)+'" y="'+(nd.y-12)+'" width="6" height="24" rx="2"/><text class="trt" x="'+nd.x+'" y="'+(nd.y+26)+'">50 Ω</text>';
    if(nd.kind==="pc"||nd.kind==="hub"){ns=ns0+'<g><title>'+nm(nd)+'</title>'+ns.slice(ns0.length)+'</g>'}
  });
  var i,a,b;
  if(type==="star"){
    var h=G.by.H;
    for(i=0;i<6;i++){a=G.by["N"+i];k+=pkt("M"+a.x+" "+a.y+" L"+h.x+" "+h.y,2.4,-i*0.4)}
    for(i=0;i<3;i++){b=G.by["N"+(i+3)];k+=pkt("M"+h.x+" "+h.y+" L"+b.x+" "+b.y,2.4,-i*0.8-0.2)}
  }else if(type==="bus"){
    var e0=G.by.E0,e1=G.by.E1;
    k+=pkt("M"+e0.x+" "+e0.y+" L"+e1.x+" "+e1.y,3.4,0);
    k+=pkt("M"+e1.x+" "+e1.y+" L"+e0.x+" "+e0.y,3.8,-1.4);
    var n0=G.by.N0,t0=G.by.T0,n3=G.by.N3,t3=G.by.T3;
    k+=pkt("M"+n0.x+" "+n0.y+" L"+t0.x+" "+t0.y,1.6,0);
    k+=pkt("M"+t3.x+" "+t3.y+" L"+n3.x+" "+n3.y,1.6,-0.8);
  }else if(type==="tree"){
    var cc=G.by.C,q0=G.by.S0,q1=G.by.S1,m0=G.by.N0,m5=G.by.N5,m4=G.by.N4,m1=G.by.N1,m2=G.by.N2;
    k+=pkt("M"+m0.x+" "+m0.y+" L"+q0.x+" "+q0.y+" L"+cc.x+" "+cc.y+" L"+q1.x+" "+q1.y+" L"+m5.x+" "+m5.y,5.2,0);
    k+=pkt("M"+m4.x+" "+m4.y+" L"+q1.x+" "+q1.y+" L"+cc.x+" "+cc.y+" L"+q0.x+" "+q0.y+" L"+m1.x+" "+m1.y,5.2,-2.6);
    k+=pkt("M"+m2.x+" "+m2.y+" L"+q0.x+" "+q0.y,1.8,-0.6);
  }else if(type==="ring"){
    var R=G.R,cx=G.cx,cy=G.cy,d="M"+(cx)+" "+(cy-R)+" A"+R+" "+R+" 0 1 1 "+(cx)+" "+(cy+R)+" A"+R+" "+R+" 0 1 1 "+(cx)+" "+(cy-R);
    ls='<circle class="lk" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/>';
    k+=pkt(d,7,0)+pkt(d,7,-3.5);
  }else{
    G.links.forEach(function(l,idx){if(idx%2===0){var A=G.by[l.a],B=G.by[l.b];k+=pkt(idx%4===0?"M"+A.x+" "+A.y+" L"+B.x+" "+B.y:"M"+B.x+" "+B.y+" L"+A.x+" "+A.y,2.6,-idx*0.37)}});
  }
  svg.innerHTML=ls+k+ns;
  try{if(matchMedia("(prefers-reduced-motion: reduce)").matches&&svg.pauseAnimations)svg.pauseAnimations()}catch(e){}
}

/* ---------- simulator ---------- */
var SIM={type:"star",ring:"single",mesh:"full",nodes:{},links:{},busy:false};
function cnt(o){return Object.keys(o).length}
function simL(){return layout(SIM.type,600,400,{mesh:SIM.mesh})}
function isDual(){return SIM.type==="ring"&&SIM.ring==="dual"}
function ruleKey(){return SIM.type==="ring"?"ring_"+SIM.ring:SIM.type==="mesh"?"mesh_"+SIM.mesh:SIM.type}

function analyze(G,S){
  S=S||SIM;
  var pcs=G.nodes.filter(function(n){return n.kind==="pc"});
  var alive=pcs.filter(function(n){return !S.nodes[n.id]});
  var up={},act={},nf=cnt(S.nodes),lf=cnt(S.links);
  if(S.type==="bus"){
    var bb=G.links.some(function(l){return l.kind==="bb"&&S.links[l.id]});
    if(!bb)alive.forEach(function(n){if(!S.links["D"+n.idx])up[n.id]=1});
  }else if(S.type==="ring"&&S.ring==="single"){
    if(nf===0&&lf===0)pcs.forEach(function(n){up[n.id]=1});
  }else{
    var adj={};G.nodes.forEach(function(n){adj[n.id]=[]});
    G.links.forEach(function(l){if(S.links[l.id]||S.nodes[l.a]||S.nodes[l.b])return;adj[l.a].push(l.b);adj[l.b].push(l.a)});
    var seen={},best=[],bestAll=[];
    G.nodes.forEach(function(n){
      if(S.nodes[n.id]||seen[n.id])return;
      var q=[n.id],comp=[];seen[n.id]=1;
      while(q.length){var c=q.shift();comp.push(c);adj[c].forEach(function(x){if(!seen[x]){seen[x]=1;q.push(x)}})}
      var cp=comp.filter(function(id){return G.by[id].kind==="pc"});
      if(cp.length>best.length){best=cp;bestAll=comp}
    });
    best.forEach(function(id){up[id]=1});
    if(best.length>=2)bestAll.forEach(function(id){act[id]=1});
  }
  if(cnt(up)<2){up={};act={}}
  return{up:up,alive:alive,pcs:pcs,act:act};
}

function route(G,s,d){
  if(SIM.type==="ring"&&SIM.ring==="single"){
    var p=[s],i=G.by[s].idx;
    while("N"+i!==d){i=(i+1)%6;p.push("N"+i)}
    return p;
  }
  var adj={};G.nodes.forEach(function(n){adj[n.id]=[]});
  G.links.forEach(function(l){if(SIM.links[l.id]||SIM.nodes[l.a]||SIM.nodes[l.b])return;adj[l.a].push(l.b);adj[l.b].push(l.a)});
  var prev={},q=[s];prev[s]=null;
  while(q.length){var c=q.shift();if(c===d)break;adj[c].forEach(function(x){if(!(x in prev)){prev[x]=c;q.push(x)}})}
  if(!(d in prev))return null;
  var path=[],cur=d;while(cur!==null){path.unshift(cur);cur=prev[cur]}
  return path;
}

function linkName(G,l){
  var t=L(),a=G.by[l.a],b=G.by[l.b];
  if(l.kind==="bb")return t.bbName;
  if(l.kind==="drop")return t.drop(t.pc+(b.idx+1));
  return nm(a)+"–"+nm(b);
}

function simRender(){

    var a=G.by[l.a],b=G.by[l.b],bad=!!SIM.links[l.id];
    var live=!bad&&!SIM.nodes[l.a]&&!SIM.nodes[l.b]&&(A.up[l.a]||A.up[l.b]||(A.act[l.a]&&A.act[l.b])||l.kind==="bb"&&cnt(A.up)>0);
    var cls="slk"+(l.kind==="bb"?" bb":"")+(isDual()&&!bad?" dual":"")+(bad?" bad":live?" on":"");
    var geom='x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"';
    linkSvg+='<g data-link="'+l.id+'"><line class="'+cls+'" '+geom+'/>';

    linkSvg+='<line class="hit" '+geom+'/>';
    if(bad){var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;linkSvg+='<path class="sx" d="M'+(mx-7)+' '+(my-7)+' L'+(mx+7)+' '+(my+7)+' M'+(mx+7)+' '+(my-7)+' L'+(mx-7)+' '+(my+7)+'"/>'}
    linkSvg+='</g>';
  });
  G.nodes.forEach(function(n){

    else if(n.kind==="term")nodeSvg+='<rect class="trm" x="'+(n.x-3)+'" y="'+(n.y-12)+'" width="6" height="24" rx="2"/><text class="trt" x="'+n.x+'" y="'+(n.y+28)+'">50 Ω</text>';
    else if(n.kind==="hub"){
      var hc=SIM.nodes[n.id]?"bad":(A.act[n.id]?"up":"");
      nodeSvg+='<g data-node="'+n.id+'" tabindex="0" role="button" aria-label="'+nm(n)+'"><rect class="shub '+hc+'" x="'+(n.x-28)+'" y="'+(n.y-19)+'" width="56" height="38" rx="9"/><text class="ht" x="'+n.x+'" y="'+n.y+'">'+(n.label||"SW")+'</text></g>';
    }else{
      var c=SIM.nodes[n.id]?"bad":A.up[n.id]?"up":"iso";
      nodeSvg+='<g data-node="'+n.id+'" tabindex="0" role="button" aria-label="'+t.pc+(n.idx+1)+'"><circle class="snd '+c+'" cx="'+n.x+'" cy="'+n.y+'" r="19"/><text class="nt" x="'+n.x+'" y="'+n.y+'">'+(n.idx+1)+'</text></g>';
    }

  var nf=cnt(SIM.nodes),lf=cnt(SIM.links),up=cnt(A.up),state;
  if(nf+lf===0)state="ok";
  else if(up===0)state="down";
  else if(up===A.alive.length)state="tolerated";
  else state="degraded";
  if(nf+lf===0&&up<6)state="ok";

  $("#stateBox").setAttribute("data-s",state);
  $("#stateTxt").textContent=txt;
  $("#mUp").textContent=up+" / 6";
  $("#mCuts").textContent=lf;
  $("#mOff").textContent=nf;
  $("#mLinks").textContent=G.links.length;
  $("#ruleTxt").textContent=t.rule[ruleKey()];

function toggleLink(id){

function pick(a){return a[Math.floor(Math.random()*a.length)]}

function sendPacket(){
  if(SIM.busy)return;
  var t=L(),G=simL(),A=analyze(G);
  if(A.alive.length<2){setLog(t.need2);return}
  var src=pick(A.alive),dst=pick(A.alive.filter(function(n){return n.id!==src.id}));
  var sn=t.pc+(src.idx+1),dn=t.pc+(dst.idx+1);
  if(!A.up[src.id]||!A.up[dst.id]){setLog(t.noRoute(sn,dn));return}
  var path=route(G,src.id,dst.id);
  if(!path){setLog(t.noRoute(sn,dn));return}
  var shown=path.filter(function(id){var k=G.by[id].kind;return k==="pc"||k==="hub"}).map(function(id){return nm(G.by[id])});
  var msg=t.pktOk(sn,dn,shown.join(" → "),path.length-1)+(SIM.type==="bus"?t.busNote:"");
  var pts=path.map(function(id){return G.by[id]}),segs=[],total=0;
  for(var i=0;i<pts.length-1;i++){var d=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);segs.push(d);total+=d}
  var svg=$("#simSvg"),dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
  dot.setAttribute("class","spkt");dot.setAttribute("r","7");dot.setAttribute("cx",pts[0].x);dot.setAttribute("cy",pts[0].y);svg.appendChild(dot);
  var reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  var dur=reduce?0:Math.max(700,total*3.2),t0=null;SIM.busy=true;
  setLog("…");
  function fin(){SIM.busy=false;if(dot.parentNode)dot.parentNode.removeChild(dot);setLog(msg)}
  function frame(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/dur),dist=p*total,j=0;
    while(j<segs.length-1&&dist>segs[j]){dist-=segs[j];j++}
    var f=segs[j]?Math.min(1,dist/segs[j]):1;
    dot.setAttribute("cx",pts[j].x+(pts[j+1].x-pts[j].x)*f);dot.setAttribute("cy",pts[j].y+(pts[j+1].y-pts[j].y)*f);
    if(p<1)requestAnimationFrame(frame);else fin();
  }
  if(reduce)fin();else requestAnimationFrame(frame);
}

function glossify(){
  var t=L(),map={},alts=[];
  t.glTerms.forEach(function(g){map[g[0].toLowerCase()]=g;alts.push(g[0].replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&"))});
  alts.sort(function(x,y){return y.length-x.length});
  var re=new RegExp("(^|[^\\w/-])("+alts.join("|")+")(?![\\w/-])","gi");
  $$("#chapters .ch-txt, #medios .gcard, #fundamentos .two > div:first-child").forEach(function(root){
    var used={};
    $$("p",root).forEach(function(p){
      p.innerHTML=p.innerHTML.split(/(<[^>]+>)/).map(function(seg){
        if(seg.charAt(0)==="<")return seg;
        return seg.replace(re,function(m,pre,w){
          var g=map[w.toLowerCase()];if(!g||used[g[0]])return m;used[g[0]]=1;
          return pre+'<abbr class="gl" tabindex="0" data-d="'+t.gl[g[1]][1].replace(/"/g,"&quot;")+'">'+w+'</abbr>';
        });
      }).join("");
    });
  });
}

var DEMO={tok:0,ty:null,timers:[]};
function dsvgNS(tag,attrs){var e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(var k in attrs)e.setAttribute(k,attrs[k]);return e}
function linkPath(G,l,type){
  var a=G.by[l.a],b=G.by[l.b];
  if(type==="ring"&&l.kind==="lk"){return "M"+a.x+" "+a.y+" A"+G.R+" "+G.R+" 0 0 1 "+b.x+" "+b.y}
  return "M"+a.x+" "+a.y+" L"+b.x+" "+b.y;
}
function demoBase(ty){
  var svg=$("#dg-"+ty),W=400,H=300,G=layout(ty,W,H,{mesh:"full"}),s="";
  svg.setAttribute("class","dg t-"+ty);
  G.links.forEach(function(l){s+='<path class="lk'+(l.kind==="bb"?" bb":"")+'" data-l="'+l.id+'" d="'+linkPath(G,l,ty)+'"/>'});
  G.nodes.forEach(function(nd){
    if(nd.kind==="pc")s+='<g data-n="'+nd.id+'"><circle class="nd" cx="'+nd.x+'" cy="'+nd.y+'" r="15"/><text class="nt" x="'+nd.x+'" y="'+nd.y+'">'+(nd.idx+1)+'</text></g>';
    else if(nd.kind==="hub")s+='<g data-n="'+nd.id+'"><rect class="hubr" x="'+(nd.x-24)+'" y="'+(nd.y-16)+'" width="48" height="32" rx="8"/><text class="ht" x="'+nd.x+'" y="'+nd.y+'">'+(nd.label||"SW")+'</text></g>';
    else if(nd.kind==="tap")s+='<g data-n="'+nd.id+'"><circle class="tapd" cx="'+nd.x+'" cy="'+nd.y+'" r="4"/></g>';
    else if(nd.kind==="term")s+='<g data-n="'+nd.id+'"><rect class="trm" x="'+(nd.x-3)+'" y="'+(nd.y-12)+'" width="6" height="24" rx="2"/><text class="trt" x="'+nd.x+'" y="'+(nd.y+26)+'">50 Ω</text></g>';
  });
  svg.innerHTML=s;
  return {svg:svg,G:G};
}
function demoStop(){
  DEMO.tok++;DEMO.timers.forEach(clearTimeout);DEMO.timers=[];
  if(DEMO.ty){var b=$('[data-demo="'+DEMO.ty+'"]');if(b)b.textContent="▶ "+L().demoAgain}
  DEMO.ty=null;
}
function demoRun(ty){
  demoStop();
  var tok=DEMO.tok,t=L(),D=demoBase(ty),svg=D.svg,G=D.G,lines=t.demo[ty],box=$('[data-dw="'+ty+'"]'),btn=$('[data-demo="'+ty+'"]');
  DEMO.ty=ty;btn.textContent="■ "+t.demoStop;
  var txt=$(".dtext",box),stp=$(".dstep",box),pr=$(".dprog",box),mac=$(".mac",box);
  pr.innerHTML=lines.map(function(){return "<i></i>"}).join("");
  mac.hidden=true;mac.innerHTML="";
  function alive(){return tok===DEMO.tok}
  function N(id){return $('[data-n="'+id+'"]',svg)}
  function cls(id,c,on){var g=N(id);if(g)g.classList[on===false?"remove":"add"](c);var el=g&&g.firstElementChild;if(el&&(c==="hl"||c==="rx"||c==="bad"))el.classList[on===false?"remove":"add"](c)}
  function lnk(id){return $('[data-l="'+id+'"]',svg)}
  function lbetween(a,b){var l=G.links.filter(function(x){return (x.a===a&&x.b===b)||(x.a===b&&x.b===a)})[0];return l}
  function wait(ms,cb){DEMO.timers.push(setTimeout(function(){if(alive())cb()},ms))}
  function fly(a,b,o,cb){
    o=o||{};var l=lbetween(a,b),el=lnk(l.id),rev=(l.a!==a),len=el.getTotalLength(),dur=o.dur||900;
    var dot=dsvgNS("circle",{class:"dpk"+(o.c?" "+o.c:""),r:o.r||6});svg.appendChild(dot);el.classList.add("hot");
    var t0=null;
    function fr(ts){
      if(!alive()){dot.remove();return}
      if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur),q=rev?1-p:p,pt=el.getPointAtLength(len*q);
      dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);
      if(p<1)requestAnimationFrame(fr);else{dot.remove();if(o.keep!==true)el.classList.remove("hot");beep(520+Math.random()*120,0.06,"triangle",0.04);if(cb)cb()}
    }
    requestAnimationFrame(fr);
  }
  function chain(ids,o,cb){var i=0;(function nx(){if(!alive())return;if(i>=ids.length-1){if(cb)cb();return}fly(ids[i],ids[i+1],o,function(){i++;nx()})})()}
  function par(fns,cb){var n=fns.length,c=0;fns.forEach(function(f){f(function(){c++;if(c===n&&cb)cb()})})}
  function say(i){txt.textContent=lines[i];stp.textContent=(lang==="es"?"Paso ":"Step ")+(i+1)+" / "+lines.length;$$("i",pr).forEach(function(x,j){x.classList.toggle("on",j<=i)});beep(660,0.12,"sine",0.05)}
  function dim(ids,on){ids.forEach(function(id){var g=N(id);if(g)g.classList[on===false?"remove":"add"]("dim")})}
  function flash(id){var g=N(id);if(g){g.classList.remove("flash");void g.getBoundingClientRect();g.classList.add("flash")}}
  var steps=[];
  var pcs=G.nodes.filter(function(n){return n.kind==="pc"}).map(function(n){return n.id});
  if(ty==="bus"){
    var tp=["T0","T1","T2","T3","T4","T5"];
    steps=[
      function(n){cls("N0","hl");wait(1900,n)},
      function(n){par([function(d){fly("N0","T0",{dur:700},d)},],function(){par([function(d){fly("T0","E0",{dur:700},d)},function(d){chain(["T0","T1","T2","T3","T4","T5","E1"],{dur:360},d)}],n)})},
      function(n){cls("N0","hl",false);cls("N3","rx");dim(["N1","N2","N4","N5"]);flash("N3");wait(2400,function(){dim(["N1","N2","N4","N5"],false);cls("N3","rx",false);n()})},
      function(n){par([function(d){fly("N1","T1",{dur:600,c:"red"},d)},function(d){fly("N4","T4",{dur:600,c:"red"},d)}],function(){
        var m=dsvgNS("text",{class:"boom",x:G.by.T2.x+30,y:G.by.T2.y-12});m.textContent="✕ collision";if(lang==="es")m.textContent="✕ colisión";svg.appendChild(m);beep(140,0.4,"sawtooth",0.07);
        par([function(d){chain(["T1","T2","T3"],{dur:700,c:"red"},d)},function(d){chain(["T4","T3"],{dur:700,c:"red"},d)}],function(){wait(1300,function(){m.remove();n()})})})},
      function(n){cls("N1","hl");wait(900,function(){chain(["N1","T1","T2","T3","N3"],{dur:520},function(){cls("N1","hl",false);flash("N3");wait(1000,n)})})}
    ];
  }else if(ty==="star"){
    var rows=[];function addRow(i){rows.push(i);mac.hidden=false;mac.innerHTML='<b>'+t.macLbl+'</b>'+rows.map(function(r){return '<div><span>'+t.port+' '+(r+1)+'</span><span>→ '+t.pc+(r+1)+'</span></div>'}).join("")}
    steps=[
      function(n){cls("N0","hl");wait(1700,n)},
      function(n){fly("N0","H",{dur:900},function(){addRow(0);flash("H");wait(900,n)})},
      function(n){par(["N1","N2","N3","N4","N5"].map(function(id){return function(d){fly("H",id,{dur:800,c:"red"},d)}}),function(){dim(["N1","N2","N4","N5"]);cls("N3","rx");wait(1500,function(){dim(["N1","N2","N4","N5"],false);n()})})},
      function(n){cls("N0","hl",false);cls("N3","rx",false);fly("N3","H",{dur:900},function(){addRow(3);flash("H");wait(900,n)})},
      function(n){dim(["N1","N2","N4","N5"]);fly("H","N0",{dur:900},function(){flash("N0");wait(1600,function(){dim(["N1","N2","N4","N5"],false);n()})})}
    ];
  }else if(ty==="ring"){
    var order=["N0","N1","N2","N3","N4","N5","N0"];
    steps=[
      function(n){chain(order,{dur:520,c:"tok",r:7},n)},
      function(n){chain(["N0","N1"],{dur:700,c:"tok",r:7},function(){cls("N1","hl");wait(500,n)})},
      function(n){chain(["N1","N2","N3","N4"],{dur:620},n)},
      function(n){cls("N4","rx");flash("N4");wait(900,function(){chain(["N4","N5","N0","N1"],{dur:620},function(){cls("N4","rx",false);n()})})},
      function(n){flash("N1");wait(800,function(){cls("N1","hl",false);chain(["N1","N2","N3"],{dur:560,c:"tok",r:7},n)})}
    ];
  }else if(ty==="mesh"){
    steps=[
      function(n){cls("N0","hl");fly("N0","N3",{dur:1300},function(){wait(500,n)})},
      function(n){var l=lnk("L0_3");l.classList.add("bad");var m=dsvgNS("text",{class:"boom",x:(G.by.N0.x+G.by.N3.x)/2+22,y:(G.by.N0.y+G.by.N3.y)/2});m.textContent="✕";svg.appendChild(m);beep(150,0.35,"sawtooth",0.06);wait(2200,n)},
      function(n){chain(["N0","N1","N3"],{dur:900},function(){flash("N3");cls("N3","rx");wait(600,n)})},
      function(n){wait(2200,n)}
    ];
  }else{
    steps=[
      function(n){cls("N0","hl");fly("N0","S0",{dur:800},function(){wait(700,n)})},
      function(n){flash("S0");fly("S0","C",{dur:900},function(){flash("C");wait(700,n)})},
      function(n){fly("C","S1",{dur:800},function(){fly("S1","N5",{dur:800},function(){cls("N5","rx");flash("N5");wait(800,n)})})},
      function(n){cls("N0","hl",false);cls("N5","rx",false);
        cls("S0","bad");dim(["N0","N1","N2"]);wait(1900,function(){cls("S0","bad",false);dim(["N0","N1","N2"],false);cls("C","bad");dim(["S0","S1","N0","N1","N2","N3","N4","N5"]);beep(150,0.35,"sawtooth",0.06);wait(2200,function(){cls("C","bad",false);dim(["S0","S1","N0","N1","N2","N3","N4","N5"],false);n()})})}
    ];
  }
  var i=0;
  (function go(){
    if(!alive())return;
    if(i>=steps.length){demoEnd();return}
    say(i);var k=i;i++;steps[k](function(){wait(350,go)});
  })();
  function demoEnd(){DEMO.ty=null;btn.textContent="↻ "+L().demoAgain}
}

var COST={n:12,d:15,pm:2500,pp:45000};

  return [["bus",n*d*1.5,n],["star",n*d,2*n],["ring",n*d,2*n],["mesh",n*(n-1)/2*d,n*(n-1)],["tree",(n+u)*d,2*n+2*u]];
}
function cop(v){try{return "$"+Math.round(v).toLocaleString("es-CO")}catch(e){return "$"+Math.round(v)}}
function renderCost(){

 cableP1:"El cableado estructurado es un sistema de cables, conectores y espacios organizado según normas, que sirve a datos, voz y video en un edificio sin depender de los equipos que se conecten. La norma de referencia es ANSI/TIA-568, publicada por primera vez en 1991 como EIA/TIA-568; su revisión actual es ANSI/TIA-568-E, de 2020.",
 cableP2:"Para este trabajo la clave es esta: en el cableado horizontal la norma usa una topología en estrella, y el troncal une los cuartos de telecomunicaciones de forma jerárquica. El resultado de un edificio completo es una topología en árbol, es decir, una estrella de estrellas.",
 subsTitle:"Los seis elementos del sistema",
 subs:[["Área de trabajo","Es donde están los usuarios: computadores, teléfonos IP e impresoras, conectados a la toma de pared con un cable de conexión (patch cord)."],["Cableado horizontal","Une cada toma del área de trabajo con el cuarto de telecomunicaciones de su piso, en topología de estrella. La distancia máxima del enlace permanente es de 90 m, y con los cables de conexión el canal completo llega a 100 m."],["Cableado troncal","Conecta los cuartos de telecomunicaciones, el cuarto de equipos y la acometida entre pisos y entre edificios. Es el backbone del sistema y suele ir en fibra óptica."],["Cuarto de telecomunicaciones","Aloja el rack, el patch panel y los switches de cada piso. Allí termina el cableado horizontal y empieza el troncal."],["Cuarto de equipos","Concentra los equipos principales del edificio: servidores, switches de núcleo y central telefónica."],["Acometida","Es el punto por donde entran al edificio los servicios del proveedor (ISP) y donde se conectan con la red interna."]],

 /* faq */
 faqTitle:"Preguntas frecuentes",faqIntro:"Respuestas cortas a las dudas más comunes sobre el tema.",
 faq:[["¿Cuál es la diferencia entre topología física y lógica?","La física es la forma en que se disponen los cables y los equipos; la lógica es el camino que siguen los datos. Una red con hub, por ejemplo, está cableada en estrella pero los datos circulan como en un bus."],["¿Por qué ya casi no se usa el bus?","Porque un solo corte tumba toda la red, es difícil encontrar la falla y el rendimiento cae con más equipos. La estrella con switch resolvió esos tres problemas."],["¿Qué topología conviene en una casa o en una pequeña empresa?","La estrella: un switch o un router central, y un cable (o una señal Wi-Fi) por equipo. Es barata, fácil de ampliar y fácil de diagnosticar."],["¿La malla es siempre mejor por ser más redundante?","No. Una malla completa de n equipos necesita n(n−1)/2 enlaces, así que el costo crece muy rápido. Por eso se usa en el núcleo de la red y no en todas partes."],["¿Qué distancia máxima tiene un cable UTP?","En cableado estructurado, el enlace permanente horizontal llega a 90 m y el canal completo, con los cables de conexión, a 100 m."],["¿Qué diferencia hay entre T568A y T568B?","Solo se intercambian los pares verde y naranja en los pines 1, 2, 3 y 6. Lo importante es usar el mismo esquema en todo el proyecto."],["¿Qué es una topología híbrida?","Es la combinación de dos o más topologías, como un árbol de estrellas con una malla parcial en el núcleo. Casi todas las redes reales son híbridas."],["¿Cómo se relaciona el cableado estructurado con las topologías?","El cableado horizontal se hace en estrella y el troncal une los cuartos de forma jerárquica; el conjunto de un edificio forma un árbol."]],
 /* historia */
 histTitle:"Historia hasta 2026",histIntro:"De un memo en 1973 a Ethernet de 1,6 Tb/s en desarrollo. Pulsa cada hito para ver el detalle.",
 timeline:[
  ["1973","Nace Ethernet","Metcalfe escribe el memo de Ethernet, con un cable compartido: un bus.","bus","El memo de Robert Metcalfe, del 22 de mayo de 1973, describía una red local con un único cable compartido por todos los equipos. De esa idea salió Ethernet.","bus"],
  ["1983","Ethernet se estandariza","El comité IEEE 802 aprueba Ethernet como IEEE 802.3.","doc","Con la aprobación del estándar, distintos fabricantes pudieron producir equipos compatibles, lo que impulsó la expansión de las redes locales.","doc"],
  ["Años 80","Token Ring","IBM impulsa el anillo con testigo, IEEE 802.5.","ring","El testigo circula por el anillo y solo quien lo tiene puede transmitir, así que no hay colisiones. Funcionaba a 4 y 16 Mb/s y, físicamente, se cableaba en estrella con unidades MAU.","ring"],
  ["1987","FDDI","Estándar ANSI de doble anillo de fibra a 100 Mb/s.","ring","FDDI usa dos anillos de fibra óptica que giran en sentidos opuestos. Si un enlace se corta, la red se reconfigura y sigue operando.","fiber"],
  ["1990","10BASE-T","Ethernet pasa al par trenzado con un equipo central.","star","Cada equipo se conecta con su propio cable a un hub o switch. Un cable dañado ya no tumba toda la red, y la estrella se impuso en las redes locales.","star"],
  ["1991","Primera norma de cableado estructurado","Se publica EIA/TIA-568 para edificios comerciales.","doc","Fue la primera versión de la norma que hoy es ANSI/TIA-568. Definió cómo cablear un edificio con independencia de los equipos que se conecten.","doc"],
  ["1995","Fast Ethernet","Ethernet sube a 100 Mb/s sobre la misma estrella.","tree","Se mantuvo el cableado en estrella con par trenzado y se multiplicó por diez la velocidad.","star"],
  ["1999","Gigabit sobre cable de cobre","IEEE 802.3ab lleva Ethernet a 1 Gb/s sobre par trenzado.","speed","IEEE 802.3ab se publicó el 26 de julio de 1999. Define 1000BASE-T: 1000 Mb/s sobre cuatro pares de cable de categoría 5.","speed"],
  ["2006","10 Gigabit sobre cobre","Se ratifica 10GBASE-T.","speed","El 8 de junio de 2006 se aprobó el estándar que lleva 10 Gb/s sobre cable de par trenzado de cuatro pares. La distancia máxima depende de la calidad del cable.","speed"],
  ["2011","Mallas inalámbricas","IEEE 802.11s lleva la malla al Wi-Fi.","mesh","Los puntos de acceso se conectan entre sí y encuentran por sí mismos la mejor ruta, lo que hoy se ve en los sistemas Wi-Fi mesh domésticos.","wifi"],
  ["2019","Wi-Fi 6","La Wi-Fi Alliance lanza la certificación de Wi-Fi 6 (802.11ax).","tree","En septiembre de 2019 se lanzó la certificación. Introdujo OFDMA y 1024-QAM para atender a más dispositivos a la vez.","wifi"],
  ["2024","Wi-Fi 7 y Ethernet de 800 Gb/s","Certificación Wi-Fi 7 y aprobación de IEEE 802.3df.","speed","El 8 de enero de 2024 la Wi-Fi Alliance lanzó Wi-Fi Certified 7 (2,4, 5 y 6 GHz). El 16 de febrero de 2024 el IEEE aprobó la norma 802.3df, que define Ethernet de 400 y 800 Gb/s.","speed"],
  ["2025","Se publica IEEE 802.11be","La norma de Wi-Fi 7 queda publicada.","mesh","La versión final de IEEE 802.11be-2024 se publicó el 22 de julio de 2025. Su velocidad teórica máxima en una banda es de 23 Gb/s; en la práctica es mucho menor.","wifi"],
  ["2026","Ethernet de 1,6 Tb/s","IEEE 802.3dj, en desarrollo.","tree","Según Network World (7 de enero de 2026), IEEE 802.3dj, que cubre 200, 400, 800 Gb/s y 1,6 Tb/s con 200 Gb/s por carril, va camino de completarse a finales de 2026. La demanda de la inteligencia artificial impulsa estas velocidades.","chip"]
 ],

 glTitle:"Glosario",glSub:"Cuarenta términos del tema. Pulsa cada uno para ampliar la definición.",glSearch:"Buscar un término",glNone:"Sin resultados.",glAll:"Todos",
 glCats:["Cables y conectores","Equipos","Protocolos y acceso","Normas","Conceptos de red"],
 gl:[
  ["CSMA/CD","Método de acceso del Ethernet clásico: escucha antes de transmitir y reintenta tras una colisión.",2,"Significa acceso múltiple por detección de portadora con detección de colisiones. El equipo verifica que el cable esté libre, transmite y, si detecta una colisión, espera un tiempo aleatorio antes de reintentar. Con switches y enlaces dedicados ya casi no hace falta."],
  ["Testigo (token)","Señal especial que circula por el anillo. Solo quien la tiene puede transmitir.",2,"Es una pequeña trama especial que pasa de equipo en equipo. Quien necesita transmitir la captura, envía su trama y al terminar libera el testigo. Evita colisiones y da un acceso equitativo."],
  ["Backbone (troncal)","Enlace principal de alta capacidad que une segmentos o switches.",4,"Es la columna vertebral de la red. Une pisos, edificios o switches de núcleo, y por eso suele ir en fibra óptica y con redundancia."],
  ["Terminador","Resistencia de 50 Ω en cada extremo de un bus coaxial. Evita que la señal rebote.",0,"Sin terminador, la señal llega al final del cable y se refleja, interfiere con las nuevas transmisiones y la red deja de funcionar. Por eso un corte en un bus lo deja inutilizable."],
  ["NIC","Tarjeta de interfaz de red. Conecta un equipo al medio físico.",1,"Convierte los datos del equipo en señales para el cable o el aire, y tiene una dirección MAC única. Puede ser una tarjeta, un chip en la placa o un adaptador USB."],
  ["MAU","Unidad de acceso multiestación de Token Ring. Se cablea en estrella pero hace circular el anillo.",1,"Dentro de la MAU el anillo es lógico: la señal pasa por cada puerto en orden. Si un equipo se desconecta, la MAU lo puentea y el anillo sigue cerrado."],
  ["Switch","Equipo que reenvía cada trama solo al puerto donde está el destino.",1,"Aprende las direcciones MAC de los equipos conectados a cada puerto y las guarda en una tabla. Así evita enviar tráfico a quien no lo necesita y elimina las colisiones en enlaces dedicados."],
  ["Hub","Repetidor que envía la señal a todos los puertos. Hoy casi no se usa.",1,"No distingue destinatarios: repite todo lo que recibe por todos los puertos. Por eso una red con hub es una estrella física pero un bus lógico."],
  ["Redundancia","Caminos o equipos de reserva que mantienen viva la red ante una falla.",4,"Es agregar enlaces o equipos duplicados para que la falla de uno no deje sin servicio a los usuarios. Mejora la disponibilidad, pero aumenta el costo."],
  ["Trama","Unidad de datos que viaja por la red en la capa de enlace.",4,"Contiene las direcciones de origen y destino, los datos y un código de verificación de errores. En Ethernet, un switch decide por dónde reenviar cada trama."],
  ["UTP","Par trenzado sin blindaje: el cable más usado en redes locales.",0,"Cuatro pares de hilos de cobre trenzados entre sí; el trenzado reduce la interferencia. Es económico y fácil de instalar. Se clasifica en categorías como Cat 5e, 6 y 6A."],
  ["STP / FTP","Par trenzado con blindaje para zonas con mucha interferencia.",0,"Lleva una malla o una lámina metálica que protege los pares. Se usa en ambientes industriales o con mucho ruido eléctrico, y exige una buena conexión a tierra."],
  ["Fibra monomodo","Fibra de núcleo muy delgado para largas distancias.",0,"Transporta un solo haz de luz y alcanza muchos kilómetros con poca pérdida. Se usa en enlaces entre edificios, ciudades y operadores."],
  ["Fibra multimodo","Fibra de núcleo más grueso para distancias cortas y medias.",0,"Permite varios haces de luz a la vez. Es más económica de conectar y se usa dentro de edificios y centros de datos, en troncales de cientos de metros."],
  ["Cable coaxial","Cable con núcleo de cobre, aislante y malla. Base del Ethernet original.",0,"Fue el medio de los primeros Ethernet de bus (10BASE5 y 10BASE2). Hoy sobrevive en televisión por cable y algunas aplicaciones de radiofrecuencia."],
  ["RJ-45","Conector de ocho pines para cable de par trenzado.",0,"Es el conector que ves en los cables de red. Sus ocho pines se conectan siguiendo el esquema T568A o T568B."],
  ["Patch cord","Cable corto con conectores que une la toma o el patch panel con el equipo.",0,"Es el cable flexible que va del computador a la toma de pared y del patch panel al switch. Cuenta dentro de los 100 m del canal."],
  ["Patch panel","Panel de conexión que organiza los cables que llegan al rack.",1,"Cada puerto del panel es el extremo de un cable horizontal. Con patch cords cortos se conecta cada puerto al switch, lo que permite cambiar conexiones sin tocar el cable fijo."],
  ["Rack","Armario estandarizado donde se montan switches, paneles y servidores.",1,"Se mide en unidades de rack (U). Un buen rack tiene organizadores de cable, ventilación y alimentación protegida con UPS."],
  ["Router","Equipo que une redes distintas y elige la mejor ruta.",1,"Trabaja con direcciones IP, no solo con MAC. Es el nodo típico de una malla y la puerta de salida de una red hacia Internet."],
  ["Punto de acceso (AP)","Equipo que conecta dispositivos inalámbricos a la red cableada.",1,"Da cobertura Wi-Fi y se conecta por cable a un switch. En una red mesh inalámbrica varios AP también se enlazan entre sí por radio."],
  ["Nodo","Cualquier equipo conectado a la red: computador, switch, router…",4,"En la teoría de grafos, con la que se modelan las topologías, los nodos son los puntos y los enlaces son las líneas que los unen."],
  ["Enlace","Conexión entre dos nodos, por cable o por radio.",4,"Cada cable de una red es un enlace. Contar los enlaces permite comparar costos: una malla completa de n nodos tiene n(n−1)/2."],
  ["Topología física","La forma en que se disponen los cables y los equipos.",4,"Describe el plano real de la red: dónde van los cables y cómo se conectan los equipos. Define cuánto cable se compra y qué se rompe cuando algo falla."],
  ["Topología lógica","El camino que siguen los datos, sin importar el cableado.",4,"Describe cómo circula la información. Puede diferir de la física, como en Token Ring: estrella física, anillo lógico."],
  ["Ancho de banda","Cantidad máxima de datos que un enlace puede transportar por segundo.",4,"Se mide en bits por segundo (Mb/s, Gb/s). Es la capacidad del enlace, que no siempre coincide con la velocidad real que ve el usuario."],
  ["Latencia","Tiempo que tarda un dato en llegar de un equipo a otro.",4,"Se mide en milisegundos. Cada salto por un switch o un router agrega un poco, por eso una topología con menos saltos suele responder más rápido."],
  ["Colisión","Choque de dos transmisiones simultáneas en un medio compartido.",2,"Ocurre en un bus o con un hub cuando dos equipos transmiten a la vez. Las tramas se dañan y deben reenviarse."],
  ["Dominio de colisión","Conjunto de equipos cuyas transmisiones pueden chocar entre sí.",4,"En un bus o con un hub, toda la red es un único dominio. Con un switch, cada puerto es su propio dominio de colisión."],
  ["Dirección MAC","Identificador único de 48 bits de cada tarjeta de red.",2,"Se escribe en hexadecimal, por ejemplo 00:1A:2B:3C:4D:5E. El switch la usa para saber en qué puerto está cada equipo."],
  ["VLAN","Red local virtual: divide un switch en varias redes separadas.",2,"Permite separar departamentos, como contabilidad y sistemas, aunque compartan los mismos switches y cables. Mejora la seguridad y reduce el tráfico innecesario."],
  ["Spanning Tree (STP)","Protocolo que evita bucles en redes con enlaces redundantes.",2,"Si una red de switches tiene caminos duplicados, las tramas pueden dar vueltas sin fin. STP bloquea algunos enlaces y los reactiva si falla el principal."],
  ["Ethernet","La familia de tecnologías de red local más usada del mundo.",3,"Nació como un bus con cable coaxial y hoy se usa en estrella con par trenzado y fibra. Sus velocidades van de 10 Mb/s a cientos de Gb/s."],
  ["IEEE 802.3","Estándar que define Ethernet.",3,"Es la norma del IEEE que describe la capa física y el acceso al medio de Ethernet. Se actualiza con enmiendas como 802.3ab (Gigabit sobre cobre) y 802.3df (400 y 800 Gb/s)."],
  ["IEEE 802.11 (Wi-Fi)","Familia de estándares de redes inalámbricas locales.",3,"Wi-Fi 6 corresponde a 802.11ax y Wi-Fi 7 a 802.11be. La variante 802.11s define las redes en malla."],
  ["ANSI/TIA-568","Norma de cableado de telecomunicaciones para edificios comerciales.",3,"Se publicó por primera vez en 1991 como EIA/TIA-568. Define categorías de cable, distancias, conectores y la topología en estrella del cableado horizontal."],
  ["T568A / T568B","Los dos esquemas de color para conectar un RJ-45.",3,"Se diferencian en el intercambio de los pares verde y naranja. Usar el mismo en ambos extremos da un cable directo; uno distinto en cada extremo, un cable cruzado."],
  ["Cableado horizontal","Cable que va de la toma de cada usuario al cuarto de telecomunicaciones.",4,"Máximo 90 m de enlace permanente. Es el subsistema con más cable de todo el edificio."],
  ["Cuarto de telecomunicaciones","Espacio que aloja el rack, el patch panel y los switches de un piso.",4,"Es el punto de encuentro entre el cableado horizontal del piso y el troncal que sube al resto del edificio."],
  ["PoE","Power over Ethernet: alimenta equipos por el mismo cable de datos.",2,"Permite energizar teléfonos IP, cámaras y puntos de acceso con el mismo cable de red, sin un adaptador de corriente aparte. Lo regulan normas como IEEE 802.3af, at y bt."]
 ],

 cableTitle:"Structured cabling: where topologies become real",
 cableP1:"Structured cabling is a system of cables, connectors and spaces organized by standards that serves data, voice and video in a building regardless of the equipment plugged into it. The reference standard is ANSI/TIA-568, first published in 1991 as EIA/TIA-568; its current revision is ANSI/TIA-568-E, from 2020.",

 faq:[["What is the difference between physical and logical topology?","The physical one is how cables and devices are laid out; the logical one is the path the data follows. A network with a hub, for example, is wired as a star but data flows as on a bus."],["Why is the bus almost never used now?","Because a single cut takes the whole network down, the fault is hard to find and performance drops with more devices. The star with a switch solved all three problems."],["Which topology suits a home or a small business?","The star: a central switch or router, and one cable (or Wi-Fi signal) per device. It is cheap, easy to expand and easy to troubleshoot."],["Is a mesh always better because it is more redundant?","No. A full mesh of n devices needs n(n−1)/2 links, so the cost grows very fast. That is why it is used in the network core and not everywhere."],["What is the maximum distance of a UTP cable?","In structured cabling, the horizontal permanent link reaches 90 m and the whole channel, with patch cords, 100 m."],["What is the difference between T568A and T568B?","Only the green and orange pairs swap places on pins 1, 2, 3 and 6. What matters is using the same scheme throughout the project."],["What is a hybrid topology?","A combination of two or more topologies, such as a tree of stars with a partial mesh in the core. Almost all real networks are hybrid."],["How does structured cabling relate to topologies?","Horizontal cabling is a star and the backbone joins the rooms hierarchically; a whole building forms a tree."]],
