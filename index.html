 timeline:[
  ["1973","Ethernet is born","Metcalfe writes the Ethernet memo, with one shared cable: a bus.","bus","Robert Metcalfe's memo, dated May 22, 1973, described a local network with a single cable shared by every device. Ethernet grew out of that idea.","bus"],
  ["1983","Ethernet is standardized","The IEEE 802 committee approves Ethernet as IEEE 802.3.","doc","With the standard approved, different manufacturers could build compatible equipment, which drove the spread of local networks.","doc"],
  ["1980s","Token Ring","IBM pushes the token-passing ring, IEEE 802.5.","ring","The token circulates around the ring and only its holder may transmit, so there are no collisions. It ran at 4 and 16 Mb/s and was physically wired as a star with MAU units.","ring"],
  ["1987","FDDI","ANSI dual fiber ring standard at 100 Mb/s.","ring","FDDI uses two optical fiber rings turning in opposite directions. If a link is cut, the network reconfigures and keeps running.","fiber"],
  ["1990","10BASE-T","Ethernet moves to twisted pair with a central device.","star","Each device connects with its own cable to a hub or switch. A damaged cable no longer takes the whole network down, and the star took over local networks.","star"],
  ["1991","First structured cabling standard","EIA/TIA-568 is published for commercial buildings.","doc","This was the first version of what is now ANSI/TIA-568. It defined how to cable a building independently of the equipment plugged in.","doc"],
  ["1995","Fast Ethernet","Ethernet reaches 100 Mb/s on the same star.","tree","Star cabling with twisted pair stayed the same while speed grew tenfold.","star"],

  ["2006","10 Gigabit over copper","10GBASE-T is ratified.","speed","On June 8, 2006 the standard that carries 10 Gb/s over four-pair twisted-pair cable was approved. The maximum distance depends on cable quality.","speed"],
  ["2011","Wireless meshes","IEEE 802.11s brings the mesh to Wi-Fi.","mesh","Access points connect to each other and find the best route on their own, as seen today in home Wi-Fi mesh systems.","wifi"],

  ["2025","IEEE 802.11be is published","The Wi-Fi 7 standard is published.","mesh","The final version of IEEE 802.11be-2024 was published on July 22, 2025. Its maximum theoretical rate in one band is 23 Gb/s; real results are much lower.","wifi"],

 glTitle:"Glossary",glSub:"Forty terms on the topic. Tap each one to expand its definition.",glSearch:"Search a term",glNone:"No results.",glAll:"All",
 glCats:["Cables and connectors","Equipment","Protocols and access","Standards","Network concepts"],
 gl:[
  ["CSMA/CD","Access method of classic Ethernet: listen before transmitting and retry after a collision.",2,"Carrier-sense multiple access with collision detection. The device checks that the cable is free, transmits and, if it detects a collision, waits a random time before retrying. With switches and dedicated links it is hardly needed anymore."],
  ["Token","Special signal that circulates around the ring. Only its holder may transmit.",2,"A small special frame that passes from device to device. Whoever needs to transmit captures it, sends its frame and releases the token when done. It avoids collisions and gives fair access."],
  ["Backbone","High-capacity main link joining segments or switches.",4,"The spine of the network. It joins floors, buildings or core switches, so it is usually optical fiber with redundancy."],
  ["Terminator","50 Ω resistor at each end of a coaxial bus. It stops the signal from bouncing back.",0,"Without a terminator the signal reaches the end of the cable and reflects, interfering with new transmissions and the network stops working. That is why a cut on a bus makes it unusable."],
  ["NIC","Network interface card. Connects a device to the physical medium.",1,"It turns the device's data into signals for the cable or the air, and has a unique MAC address. It can be a card, a chip on the motherboard or a USB adapter."],
  ["MAU","Token Ring multistation access unit. Wired as a star but circulates the ring.",1,"Inside the MAU the ring is logical: the signal goes through each port in order. If a device is disconnected, the MAU bypasses it and the ring stays closed."],
  ["Switch","Device that forwards each frame only to the port where the destination is.",1,"It learns the MAC addresses of the devices on each port and stores them in a table. That avoids sending traffic to those who do not need it and removes collisions on dedicated links."],
  ["Hub","Repeater that sends the signal out of every port. Rarely used today.",1,"It does not tell recipients apart: it repeats everything it receives out of every port. That is why a hub network is a physical star but a logical bus."],
  ["Redundancy","Spare paths or devices that keep the network alive when something fails.",4,"Adding duplicate links or devices so that one failure does not leave users without service. It improves availability but raises cost."],
  ["Frame","Unit of data that travels the network at the link layer.",4,"It contains the source and destination addresses, the data and an error-check code. In Ethernet, a switch decides where to forward each frame."],
  ["UTP","Unshielded twisted pair: the most used cable in local networks.",0,"Four pairs of copper wires twisted together; the twist reduces interference. It is cheap and easy to install. It is graded in categories such as Cat 5e, 6 and 6A."],
  ["STP / FTP","Shielded twisted pair for areas with a lot of interference.",0,"It has a metal braid or foil that protects the pairs. Used in industrial or electrically noisy environments, and it needs good grounding."],
  ["Single-mode fiber","Very thin-core fiber for long distances.",0,"Carries a single beam of light and reaches many kilometers with little loss. Used in links between buildings, cities and carriers."],
  ["Multimode fiber","Thicker-core fiber for short and medium distances.",0,"Allows several beams of light at once. It is cheaper to terminate and is used inside buildings and data centers, on backbones of hundreds of meters."],
  ["Coaxial cable","Cable with a copper core, insulation and shield. Basis of original Ethernet.",0,"It was the medium of the first bus Ethernets (10BASE5 and 10BASE2). Today it survives in cable TV and some radio-frequency applications."],
  ["RJ-45","Eight-pin connector for twisted-pair cable.",0,"The connector you see on network cables. Its eight pins are wired following the T568A or T568B scheme."],
  ["Patch cord","Short cable with connectors joining the outlet or patch panel to the device.",0,"The flexible cable that goes from the computer to the wall outlet and from the patch panel to the switch. It counts toward the 100 m of the channel."],
  ["Patch panel","Connection panel that organizes the cables arriving at the rack.",1,"Each panel port is the end of a horizontal cable. Short patch cords link each port to the switch, so connections can be changed without touching the fixed cable."],
  ["Rack","Standardized cabinet where switches, panels and servers are mounted.",1,"Measured in rack units (U). A good rack has cable managers, ventilation and UPS-protected power."],
  ["Router","Device that joins different networks and picks the best route.",1,"It works with IP addresses, not just MAC. It is the typical node of a mesh and the network's gateway to the Internet."],
  ["Access point (AP)","Device that connects wireless devices to the wired network.",1,"It provides Wi-Fi coverage and connects by cable to a switch. In a wireless mesh several APs also link to each other by radio."],
  ["Node","Any device connected to the network: computer, switch, router…",4,"In graph theory, used to model topologies, nodes are the points and links are the lines joining them."],
  ["Link","Connection between two nodes, by cable or by radio.",4,"Every cable in a network is a link. Counting links lets you compare costs: a full mesh of n nodes has n(n−1)/2."],
  ["Physical topology","How cables and devices are laid out.",4,"It describes the real plan of the network: where cables go and how devices connect. It defines how much cable is bought and what breaks when something fails."],
  ["Logical topology","The path data follows, regardless of cabling.",4,"It describes how information flows. It can differ from the physical one, as in Token Ring: physical star, logical ring."],
  ["Bandwidth","Maximum amount of data a link can carry per second.",4,"Measured in bits per second (Mb/s, Gb/s). It is the link's capacity, which does not always match the real speed the user sees."],
  ["Latency","Time a piece of data takes to get from one device to another.",4,"Measured in milliseconds. Each hop through a switch or router adds a little, so a topology with fewer hops usually responds faster."],
  ["Collision","Clash of two simultaneous transmissions on a shared medium.",2,"Happens on a bus or with a hub when two devices transmit at once. The frames are corrupted and must be resent."],
  ["Collision domain","Set of devices whose transmissions can clash with each other.",4,"On a bus or with a hub the whole network is a single domain. With a switch, each port is its own collision domain."],
  ["MAC address","Unique 48-bit identifier of each network card.",2,"Written in hexadecimal, for example 00:1A:2B:3C:4D:5E. The switch uses it to know which port each device is on."],
  ["VLAN","Virtual local network: splits one switch into several separate networks.",2,"Lets you separate departments, such as accounting and IT, even if they share the same switches and cables. It improves security and reduces unnecessary traffic."],
  ["Spanning Tree (STP)","Protocol that prevents loops in networks with redundant links.",2,"If a network of switches has duplicate paths, frames can circle forever. STP blocks some links and reactivates them if the main one fails."],
  ["Ethernet","The most widely used family of local network technologies.",3,"It was born as a bus over coaxial cable and today is used as a star over twisted pair and fiber. Its speeds range from 10 Mb/s to hundreds of Gb/s."],
  ["IEEE 802.3","The standard that defines Ethernet.",3,"The IEEE standard describing Ethernet's physical layer and medium access. It is updated through amendments such as 802.3ab (Gigabit over copper) and 802.3df (400 and 800 Gb/s)."],
  ["IEEE 802.11 (Wi-Fi)","Family of wireless local network standards.",3,"Wi-Fi 6 corresponds to 802.11ax and Wi-Fi 7 to 802.11be. The 802.11s variant defines mesh networks."],
  ["ANSI/TIA-568","Telecommunications cabling standard for commercial buildings.",3,"First published in 1991 as EIA/TIA-568. It defines cable categories, distances, connectors and the star topology of horizontal cabling."],
  ["T568A / T568B","The two color schemes for wiring an RJ-45.",3,"They differ in swapping the green and orange pairs. Using the same at both ends gives a straight-through cable; a different one at each end, a crossover cable."],
  ["Horizontal cabling","Cable from each user's outlet to the telecommunications room.",4,"Maximum 90 m permanent link. It is the subsystem with the most cable in the whole building."],
  ["Telecommunications room","Space housing a floor's rack, patch panel and switches.",4,"The meeting point between the floor's horizontal cabling and the backbone that rises to the rest of the building."],
  ["PoE","Power over Ethernet: powers devices through the same data cable.",2,"Lets IP phones, cameras and access points be powered over the same network cable, without a separate power adapter. Governed by standards such as IEEE 802.3af, at and bt."]

}
function kMove(d){
  if(!KS.res.length)return;KS.sel=(KS.sel+d+KS.res.length)%KS.res.length;
  $$("#kRes li").forEach(function(li,n){li.setAttribute("aria-selected",n===KS.sel);if(n===KS.sel)li.scrollIntoView({block:"nearest"})});
}
function wireSearch(){
  $("#kBtn").addEventListener("click",kOpen);
  $("#kIn").addEventListener("input",kSearch);
  $("#kov").addEventListener("click",function(e){if(e.target.id==="kov")kClose()});
  $("#kRes").addEventListener("click",function(e){var li=e.target.closest("[data-k]");if(li&&KS.res[+li.getAttribute("data-k")])KS.res[+li.getAttribute("data-k")].go()});
  document.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){e.preventDefault();$("#kov").hidden?kOpen():kClose();return}
    if($("#kov").hidden)return;
    if(e.key==="Escape"){kClose();$("#kBtn").focus()}
    else if(e.key==="ArrowDown"){e.preventDefault();kMove(1)}
    else if(e.key==="ArrowUp"){e.preventDefault();kMove(-1)}
    else if(e.key==="Enter"){e.preventDefault();var r=KS.res[KS.sel];if(r)r.go()}
  },true);
}

/* ---- wiring ---- */
function wireV6(){
  document.addEventListener("click",function(e){
    var a=e.target.closest("[data-accact]");
    if(a){var bar=a.closest(".acc-bar"),tg=$(bar.getAttribute("data-for")),open=a.getAttribute("data-accact")==="open";$$("details",tg).forEach(function(d){d.open=open});return}
    var c=e.target.closest("[data-glc]");if(c){GL.cat=+c.getAttribute("data-glc");GL.ltr="";renderGlossary();return}
    var l=e.target.closest("[data-gll]");if(l){var v=l.getAttribute("data-gll");GL.ltr=GL.ltr===v?"":v;renderGlossary();return}
    var tt=e.target.closest("[data-t568]");if(tt){var p=tt.getAttribute("data-t568").split(":");T568S[p[0]]=p[1];renderT568();return}
    var d=e.target.closest("[data-dsp]");if(d){DS.pr=d.getAttribute("data-dsp");renderDesign();return}
  });
  document.addEventListener("input",function(e){
    if(e.target.id==="dsF"){DS.fl=+e.target.value;$("#dsFv").textContent=DS.fl;dsOut()}
    else if(e.target.id==="dsP"){DS.per=+e.target.value;$("#dsPv").textContent=DS.per;dsOut()}
  });
  wireGame();wireSearch();
  try{new IntersectionObserver(function(en){if(en[0].isIntersecting)runStats()},{threshold:.3}).observe($("#stats"))}catch(e){runStats()}
}
function renderV6(){
  renderFaq();renderRefs();renderStats();renderCable();renderDesign();renderGame();renderAccBars();
  if(STATS_DONE)$$("#stats b").forEach(function(b){b.textContent=b.getAttribute("data-to")});
}

wireCost();wireLearn();wireNav();wireV6();

wireSim();
applyLang();
heroNet();
})();
</script>
